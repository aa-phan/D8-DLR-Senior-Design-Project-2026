name: Supabase Smoke

# Proves that a GitHub-hosted runner (IPv4 only) reaches the Supabase session pooler as the
# least-privilege writer dlr_writer using only the repository secret SUPABASE_DB_URL
# (Phase 4, DB-04, ROADMAP SC4). Dispatch-only and never scheduled. Touches no
# shadow-collection file or data, and writes nothing that persists (the smoke test rolls back
# every write). The log holds only pass/fail lines, counts, the role name and the server version.
# Run with:
#   gh workflow run supabase_smoke.yml --ref main
# Pushing this file changes live CI, so the owner approves it first (plan 04-06).
#
# Hardening (code-review IN-05):
#   - Every action is pinned by full commit SHA, resolved read-only on 2026-10-23 from the
#     official actions/* repositories (the commit each tag pointed to that day); the version
#     is in the comment on the same line. Bump a pin deliberately, never by a moving tag.
#   - The checkout does not persist its token (persist-credentials: false); the job needs
#     no git credential after checkout.
#   - The job runs only when github.ref is refs/heads/main, so a dispatch from another
#     branch cannot run an edited copy of the smoke code with the writer secret. A branch
#     that edits this workflow file itself can remove that guard, so the server-side
#     control is the `production` environment holding SUPABASE_DB_URL with a main-only
#     deployment-branch rule (GitHub settings; dlr_live.yml uses the same environment).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Database smoke test
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: PYTHONPATH=backend python backend/supabase_smoke.py
